name: Fixed snapshot comparison
on:
  push:
    branches: [research/snapshot-sensitivity-20261105]
    paths: [.github/workflows/snapshot-sensitivity.yml]
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: snapshot-study-${{ github.run_id }}
          restore-keys: market-v2-
      - run: pip install -r requirements.txt
      - name: Backtest all five versions
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python - <<'PY'
          import csv, gc, json, math, traceback
          from collections import defaultdict
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from runner import data, signals
          from strategies import champion_source as ch

          start, end, snapshot = '2024-01-04', '2026-11-05', '2026-11-06'
          output = Path('factor-gate-research')
          output.mkdir(exist_ok=True)
          result = {'start': start, 'end': end, 'snapshot': snapshot, 'budget_per_trade': 10000,
                    'account_denominator': 200000, 'variants': {}}
          try:
              spot = data.stock_spot(snapshot)
              mapping = data.board_mapping(snapshot)
              big = set(spot.head(800).code6)
              codes = sorted(big | set(spot.tail(800).code6))
              frames, errors = data.histories(codes, end)
              for code in big - set(mapping.code):
                  frames.pop(code, None)
              result['coverage'] = {'loaded': len(frames), 'expected': len(codes),
                                    'scored_universe': len(big & set(frames)), 'history_errors': len(errors)}
              if len(frames) < len(codes)*.98:
                  raise RuntimeError(f'Insufficient histories: {len(frames)}/{len(codes)}')
              panel = pd.concat(frames.values(), ignore_index=True).rename(columns={
                  'date':'日期','open':'开盘','close':'收盘','high':'最高','low':'最低',
                  'volume':'成交量','amount':'成交额','amplitude':'振幅','pct':'涨跌幅','turnover':'换手率'})
              del frames
              bd = ch.build_board_day(ch.daily_stats_of(panel), mapping)
              large = panel[panel.code.isin(big)].copy()
              del panel
              idx = data.history('000300', end, index=True).rename(columns={'date':'日期','close':'收盘'})
              if idx['日期'].min() > pd.Timestamp(start):
                  older = data._tx_piece('000300', '2025-12-31', '2024-01-01', False, True)
                  older = older.rename(columns={'date':'日期','close':'收盘'})
                  idx = pd.concat([older, idx], ignore_index=True).drop_duplicates('日期', keep='last')
              days = list(idx.loc[idx['日期'].between(start,end), '日期'].sort_values())
              if not days or str(days[0].date()) != start or str(days[-1].date()) != end:
                  raise RuntimeError(f'Index history {idx["日期"].min()} to {idx["日期"].max()}, requested slice {days[:1]} to {days[-1:]}')
              result['sessions'] = len(days)
              ch.piecewise_reverse = signals.causal_piecewise
              ch.add_zt_ecofactors = signals.causal_ecology
              bars = large.set_index(['日期','code'])[['开盘','最高','最低','收盘','成交量']]
              names = spot.set_index('code6')['名称'].to_dict()
              profiles = {
                  'balanced_ref': ((5,20,120), None, 'balanced'),
                  'runner_ref': ((5,20,120), None, 'runner'),
                  'price_volume': (None, (1.6,.7,.8,.2,1.2,-.8,-.4,0,0,0,0), None),
                  'relative_strength': (None, (.8,.6,.6,.4,1.0,-.5,-.4,.3,0,-.2,2.0), None),
                  'sector_momentum': (None, (1.0,.5,.5,.5,.8,-.5,-.3,1.4,.6,.4,.8), None),
                  'cool_sector_leader': (None, (1.2,.6,.7,.2,1.0,-.8,-.4,-.8,-.5,-.3,2.0), None),
                  'low_vol_position': (None, (.7,1.2,.4,0,1.4,-1.2,-.5,.2,0,0,.7), None),
                  'volume_open_impulse': (None, (2.0,.3,1.6,.8,.4,-.3,-.3,.5,.3,0,1.2), None),
              }
              factors = ['vol_ratio','turnover_score','open_str','zt_count','position','amplitude','mktcap',
                         'theme_mom5','theme_zt','theme_rank','theme_rs']
              result['factor_order'] = factors
              result['profiles'] = profiles
              index_close = idx.sort_values('日期').set_index('日期')['收盘']
              ma = {n:index_close.rolling(n).mean() for n in (20,60,120)}
              gates = {f'MA{n}': index_close.gt(m) for n,m in ma.items()}
              gates['MA20+MA60'] = gates['MA20'] & gates['MA60']
              gates['MA20+rising'] = gates['MA20'] & ma[20].gt(ma[20].shift(5))
              gates['MA60+positive5d'] = gates['MA60'] & index_close.pct_change(5).gt(0)
              result['windows'] = {'fast': [3,10,60], 'medium': [5,20,120], 'slow': [10,40,120]}
              for window_name, window in result['windows'].items():
                win = dict(zip(('vol_ma','to_window','pos_window'),window))
                group_frame = ch.compute_factors(large, win, ch.VERSIONS['balanced']['weights'], mapping, bd, spot)
                standardized = {}
                for col in factors:
                    g = group_frame.groupby('日期')[col]
                    standardized[col] = ((group_frame[col]-g.transform('mean'))/(g.transform('std')+1e-12)).clip(-3,3)
                for profile, (_, weights, reference) in profiles.items():
                  if reference and window_name != 'medium':
                      continue
                  version = f'{profile}-{window_name}'
                  if reference:
                      score = group_frame['score_raw'] + sum(ch.VERSIONS[reference]['weights'][k]*group_frame['z_'+k]
                                                             for k in ch.FACTORS)
                  else:
                      score = sum(w*standardized[k] for w,k in zip(weights,factors) if w)
                  f = group_frame.loc[group_frame['成交量'].gt(0), ['日期','code']].copy()
                  f['score'] = score
                  f = f.replace([np.inf,-np.inf],np.nan).dropna()
                  picks = f.sort_values(['日期','score','code'], ascending=[True,False,True]).groupby('日期').head(2)
                  ranked = {day: list(g.itertuples(index=False,name=None)) for day,g in picks.groupby('日期')}
                  del f, picks
                  result['variants'][version] = {}
                  for hold in (1, 4):
                      ledger, attempted, signal_days = [], 0, 0
                      for i, signal_day in enumerate(days):
                          exit_i = i+1+hold
                          if i+1+4 >= len(days):
                              break
                          ranked_today = ranked.get(signal_day, [])
                          if len(ranked_today) < 2:
                              continue
                          signal_days += 1
                          buy_day, sell_day = days[i+1], days[exit_i]
                          for rank, (_, code, score) in enumerate(ranked_today, 1):
                              attempted += 1
                              if (buy_day,code) not in bars.index or (sell_day,code) not in bars.index:
                                  continue
                              b = bars.loc[(buy_day,code)]
                              s = bars.loc[(sell_day,code)]
                              buy_px = float(b['开盘'])
                              sell_px = float(s['收盘'])
                              if not (math.isfinite(buy_px) and math.isfinite(sell_px) and buy_px>0 and sell_px>0):
                                  continue
                              if abs(buy_px-float(b['最高']))/buy_px < .002:
                                  continue
                              ret = (sell_px/(1+ch.SELL_COST))/(buy_px/(1-ch.BUY_COST))-1
                              rounded = round(buy_px,3)
                              if rounded <= 0:
                                  continue
                              shares = math.floor(10000/rounded)
                              shares = (shares if shares>=200 else 0) if code.startswith('688') else shares//100*100
                              principal = shares*rounded
                              ledger.append(dict(signal_date=str(signal_day.date()),rank=rank,code=code,name=names.get(code,code),
                                                 score=score,buy_date=str(buy_day.date()),sell_date=str(sell_day.date()),
                                                 buy_px=buy_px,sell_px=sell_px,net_return=ret,full_budget_pnl=ret*10000,
                                                 shares=shares,lot_principal=principal,lot_pnl=ret*principal))
                      by_key = result['variants'][version][str(hold)] = {}
                      cut = '2026-01-01'
                      def metrics(rows):
                          daily = defaultdict(float)
                          for row in rows:
                              daily[row['sell_date']] += row['lot_pnl']
                          pnl = high = dd = 0.
                          for d in sorted(daily):
                              pnl += daily[d]
                              high = max(high,pnl)
                              dd = max(dd,high-pnl)
                          return dict(trades=len(rows),pnl=pnl,drawdown=dd,
                                      avg=pnl/len(rows) if rows else None,
                                      win_rate=sum(r['lot_pnl']>0 for r in rows)/len(rows) if rows else None)
                      for gate_name, gate in gates.items():
                          for top in (1,2):
                              lots = [r for r in ledger if r['shares'] and r['rank'] <= top and
                                      bool(gate.get(pd.Timestamp(r['signal_date']),False))]
                              by_key[f'{gate_name}/Top{top}'] = dict(full=metrics(lots),
                                  train=metrics([r for r in lots if r['sell_date'] < cut]),
                                  test=metrics([r for r in lots if r['signal_date'] >= cut]))
                del group_frame, standardized
                gc.collect()
          except Exception:
              result['error'] = traceback.format_exc()
          (output/'summary.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Save backtest on research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add factor-gate-research
          git commit -m 'Record fixed-snapshot Top2 backtest'
          git push origin HEAD:${{ github.ref_name }}
