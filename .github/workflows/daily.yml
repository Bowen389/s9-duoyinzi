name: Eight strategies daily paper
on:
  schedule:
    # UTC -> Beijing: 15:10 early scan; 16:35 refresh; 17:10 and 19:10 recovery.
    - cron: '10 7 * * 1-5'
    - cron: '35 8 * * 1-5'
    - cron: '10 9 * * 1-5'
    - cron: '10 11 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['runner/**', 'strategies/**', 'tests/**', 'requirements.txt', '.github/workflows/**']
permissions:
  contents: write
jobs:
  preflight:
    name: Real provider connectivity
    # Diagnostics must never prevent independent strategy scans, even on timeout.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify real price, turnover, amount and board sources
        env:
          TZ: Asia/Shanghai
          PYTHONUNBUFFERED: '1'
        run: python -m runner.preflight
  scan:
    # Provider probes are diagnostic and run in parallel with actual input validation.
    concurrency:
      group: independent-paper-main
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --durations=5
      - uses: actions/cache/restore@v4
        id: market-cache
        with:
          path: cache
          key: market-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: market-v2-
      - name: Settle and scan all accounts
        id: scan
        env:
          TZ: Asia/Shanghai
          PYTHONUNBUFFERED: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m runner.main
      - name: Persist accounts and signals even when a provider fails
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper signals reports
          if ! git diff --cached --quiet; then
            git commit -m 'Update dated signals and independent paper accounts'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 2
            done
          fi
      - name: Save recoverable market cache
        # Never shadow usable history caches with an empty cache from failed tests.
        if: always() && steps.scan.outcome != '' && steps.scan.outcome != 'skipped' && hashFiles('cache/**/*.parquet') != ''
        uses: actions/cache/save@v4
        with:
          path: cache
          key: market-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish job summary
        if: always()
        run: |
          if [ -f reports/latest.md ]; then cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-${{ github.run_id }}
          path: |
            reports/
            signals/
            paper/
